const GL=[['RM (repetición máxima)','Porcentaje del peso con el que solo harías 1 repetición. «30 % RM» es una carga muy ligera; «85 % RM» es muy pesada. Calcula tu RM en cada máquina con tus mejores series recientes.'],['Excéntrica y concéntrica','Concéntrica: fase en que el músculo se acorta (empujar o tirar). Excéntrica: fase de bajada controlada. «Excéntrica 3 seg + concéntrica explosiva» significa bajar en 3 segundos y subir rápido.'],['Lentas + control (4 o 6 seg por rep)','Cada repetición completa dura 4 o 6 segundos. Prioriza sentir el músculo objetivo antes que mover más peso.'],['Superserie','Dos ejercicios seguidos sin descanso entre ellos. Descansa solo al terminar el par.'],['Fallo y miniseries','Fallo: la serie termina cuando no puedes completar otra repetición con buena técnica. Minireps: repeticiones parciales cortas al final para exprimir la serie.'],['Isométricos','Mantienes la posición sin moverte (por ejemplo, sentadilla isométrica de 45 a 60 seg). Debes sentirlo en los músculos objetivo; si no, revisa la postura.'],['Biomecánica del movimiento','Cuida el recorrido y la alineación: ejecución controlada, sin balanceos. Si hay dolor, reduce el recorrido.'],['Parada a mitad de repetición','Pausa de 2 segundos en el punto medio del recorrido para eliminar el impulso.'],['FC en el cardio','Aparece como en tu Excel («10 MIN 80 FC»). Se interpreta como la frecuencia cardiaca objetivo de ese bloque; confirma con tu entrenador si son pulsaciones por minuto o un porcentaje.'],['Descanso de 3 a 4 min','Quality hypertrophy exige descansos largos entre series para repetir con la misma calidad. Usa el cronómetro inferior.']];

const IM=k=>k?D.imgs[k]:'';

function ccBlock(kind,idx){const w=S.w,L=lg('cc');
 if(kind=='c'){const c=D.cardio[idx];return `<div class="card"><h3 class="f" style="font-size:22px">Cardio · ${c.lvl}</h3><p style="color:var(--mut);margin:2px 0 10px">${c.days}</p><div class="cg">${c.img.filter((x,i,a)=>x&&a.indexOf(x)==i).map(x=>`<div class="ci"><div class="th" style="background-image:url(${IM(x)});cursor:default"></div></div>`).join('')}</div>${c.steps.map((s,j)=>{const k='c'+idx+'_'+j,m=(s.match(/(\d+)\s*MIN/i)||[])[1];return `<div class="st" style="grid-template-columns:28px 1fr auto"><input type="checkbox" data-a="ck2" data-k="${k}" ${L.c[k]?'checked':''} aria-label="Bloque completado"><div class="p"><b>${esc(s.replace(/\s+/g,' '))}</b></div>${m?`<button class="btn" data-a="t" data-s="${m*60}">Iniciar ${m} min</button>`:''}</div>`}).join('')}</div>`}
 const c=D.core[idx];return `<div class="card"><h3 class="f" style="font-size:22px">Abdominales · ${c.lvl}</h3><p style="color:var(--mut);margin:2px 0 10px">${c.days}</p><div class="cg">${c.items.map((it,j)=>{const k='a'+idx+'_'+j;return `<div class="ci"><div class="th" style="background-image:url(${IM(it[1])});cursor:default"></div><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-a="ck2" data-k="${k}" ${L.c[k]?'checked':''}><b>${esc(it[0].replace(/\s+/g,' '))}</b></label></div>`}).join('')}</div></div>`}
function vRut(){const d=dayOf(S.d),dk=S.d,l=lg(dk);
 const tabs=`<div class="days" role="tablist">${DN.map(k=>{const dd=dayOf(k);return `<button role="tab" data-a="day" data-k="${k}" aria-selected="${k==S.d}">${DL[k]}${dd?`<i style="width:${pct(dd,S.w)}%"></i>`:''}</button>`}).join('')}</div>`;
 if(!d)return tabs+`<div class="card"><h2 class="f" style="font-size:40px">Jueves · descanso</h2><p style="color:var(--mut)">Tu Excel no programa sesión el jueves. Aprovecha para recuperar: sueño, comida y movilidad suave.</p></div>`;
 const mp=MAP[dk]||{};
 return tabs+`<div class="card hero"><div><div class="chips"><span class="chip">${esc(d.style)}</span><span class="chip">${esc(d.rest)}</span></div><h2>${d.n}</h2><p>${esc(cl(d.focus))}</p></div><div class="big"><span id="pg">${pct(d,S.w)}%</span><small id="ps">${done(d)} de ${tot(d)} series</small></div><div class="bar" style="grid-column:1/-1"><b id="pb" style="width:${pct(d,S.w)}%"></b></div></div>
<div class="card"><h3 class="f">Preparación y suplementos</h3><div class="chips">${[d.mov,d.warm].map((x,i)=>`<span class="chip t ${l.sup['p'+i]?'on':''}" data-a="sp" data-k="p${i}" role="button" tabindex="0">${esc(x)}</span>`).join('')}${d.sup.map(s=>`<span class="chip t ${l.sup[s]?'on':''}" data-a="sp" data-k="${esc(s)}" role="button" tabindex="0">${esc(s)}</span>`).join('')}</div><p style="color:var(--mut);margin:0;font-size:13px">Toca para marcar como hecho.</p></div>
${d.ex.map((e,i)=>exCard(d,e,i)).join('')}
${mp.c!=null?`<h2 class="s f">Cardio del día</h2>`+ccBlock('c',mp.c):''}${mp.o!=null?`<h2 class="s f">Abdominales del día</h2>`+ccBlock('o',mp.o):''}
<div class="card"><h3 class="f">Cierre de sesión</h3><label>Esfuerzo percibido (1–10): <b id="rv" style="color:var(--ac)">${l.rpe}</b></label><input type="range" min="1" max="10" value="${l.rpe}" data-f="rpe" style="width:100%;accent-color:#5ee1ff"><label style="display:block;margin-top:10px">Notas de la sesión</label><textarea data-f="nt" rows="3">${esc(l.nt)}</textarea><div class="act"><button class="btn p" data-a="all">Marcar sesión completa</button><button class="btn d" data-a="clr">Reiniciar día</button></div></div>`}
function vCa(){return `<div class="card hero"><div><h2>Cardio y abdominales</h2><p>Bloques de tu Excel: cardio nivel 1 (lunes) y nivel 2 (viernes), abdominales nivel 1 (martes) y nivel 2 (sábado).</p></div></div><div class="row2"><div>${ccBlock('c',0)}${ccBlock('c',1)}</div><div>${ccBlock('o',0)}${ccBlock('o',1)}</div></div>`}
function ccBlockO(){}
function vSe(){const ds=D.days,w=S.w;const tp=ds.reduce((a,d)=>a+pct(d,w),0)/ds.length,tv=ds.reduce((a,d)=>a+vol(d,w),0);
 const bars=(v,lb,mx,u)=>{const W=60;return `<svg viewBox="0 0 ${v.length*W} 150" width="100%" role="img">${v.map((x,i)=>`<rect x="${i*W+14}" y="${120-(mx?x/mx*100:0)}" width="32" height="${mx?x/mx*100:0}" fill="#5ee1ff"/><text x="${i*W+30}" y="136" text-anchor="middle">${lb[i]}</text><text x="${i*W+30}" y="${114-(mx?x/mx*100:0)}" text-anchor="middle">${x?Math.round(x)+u:''}</text>`).join('')}<line x1="0" x2="${v.length*W}" y1="120" y2="120" stroke="#35444e"/></svg>`};
 const W5=[1,2,3,4,5];
 return `<div class="card hero"><div><h2>Seguimiento · semana ${w}</h2><p>Se calcula con las series marcadas y los kilos y repeticiones que anotes en cada día.</p></div></div><div class="kp"><div><b>${Math.round(tp)}%</b><span>cumplimiento medio</span></div><div><b>${ds.reduce((a,d)=>a+done(d),0)}</b><span>series completadas</span></div><div><b>${Math.round(tv).toLocaleString('es-ES')}</b><span>volumen kg × reps</span></div><div><b>${ds.filter(d=>pct(d,w)==100).length}/${ds.length}</b><span>sesiones completas</span></div></div>
<div class="row2"><div class="card"><h3 class="f">Cumplimiento por día (%)</h3>${bars(ds.map(d=>pct(d,w)),ds.map(d=>DL[d.k]),100,'%')}</div><div class="card"><h3 class="f">Volumen por semana (kg × reps)</h3>${bars(W5.map(x=>ds.reduce((a,d)=>a+vol(d,x),0)),W5.map(x=>'S'+x),Math.max(1,...W5.map(x=>ds.reduce((a,d)=>a+vol(d,x),0))),'')}</div></div>
<div class="card"><h3 class="f">Copia de seguridad</h3><textarea id="bk" rows="3" placeholder="Pulsa Exportar y copia el texto, o pega una copia y pulsa Importar."></textarea><div class="act"><button class="btn" data-a="ex">Exportar</button><button class="btn" data-a="im">Importar</button><button class="btn d" data-a="rs">Borrar todo</button></div></div>`}
function vAp(){const all=[];D.days.forEach(d=>d.ex.forEach((e,i)=>{if(e.imgs[0]&&!all.find(a=>a[0].name==e.name))all.push([e,d.k,i])}));
 return `<div class="card hero"><div><h2>Aprender</h2><p>Glosario de las claves de tu plan y galería de todos los ejercicios. Toca una imagen para ver técnica, indicaciones y series.</p></div></div><h2 class="s f">Glosario</h2>${GL.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join('')}<h2 class="s f">Galería de ejercicios</h2><div class="cg">${all.map(a=>`<div class="ci">${img(a[0].imgs[0],a[0].name,a[2],a[1])}<b style="display:block;margin-top:6px">${esc(a[0].name)}</b></div>`).join('')}</div>`}
function render(){const y=scrollY;$('#m').innerHTML={r:vRut,c:vCa,s:vSe,a:vAp}[S.v]();$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v==S.v));scrollTo(0,y)}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#tabs').innerHTML=[['r','Rutina'],['c','Cardio y abs'],['s','Seguimiento'],['a','Aprender']].map(a=>`<button data-v="${a[0]}" aria-selected="false">${a[1]}</button>`).join('');
$('#wk').innerHTML=[1,2,3,4,5].map(x=>`<option ${x==S.w?'selected':''}>${x}</option>`).join('');
$('#wk').onchange=e=>{S.w=+e.target.value;sv();render()};
function upd(){const d=dayOf(S.d);if(!d||!$('#pg'))return;const p=pct(d,S.w);$('#pg').textContent=p+'%';$('#pb').style.width=p+'%';$('#ps').textContent=done(d)+' de '+tot(d)+' series'}
function modal(dk,i){const d=dayOf(dk),e=d.ex[i];$('#mod').innerHTML=`<div class="card"><button class="btn" data-a="x" style="float:right">Cerrar</button><h2 class="f" style="font-size:30px">${esc(e.name)}</h2><div class="chips">${e.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">${esc(d.rest)}</span></div>${e.imgs.map(x=>`<img src="${IM(x)}" alt="${esc(e.name)}" style="margin-bottom:10px">`).join('')}<h3 class="f">Series prescritas</h3>${e.sets.map(s=>`<div class="st" style="grid-template-columns:1fr"><div class="p"><b>${esc(s.s)}</b> ${s.x?`<span class="chip">${esc(s.x)}</span>`:''}<small>${esc(s.t)}</small></div></div>`).join('')}${e.note?`<h3 class="f" style="margin-top:14px">Indicación del entrenador</h3><p>${esc(e.note)}</p>`:''}<div class="act"><button class="btn p" data-a="t" data-s="180">Descanso 3:00</button></div></div>`;$('#mod').classList.add('on')}
let ti=null,tl=0;function tick(){const o=$('#to');o.textContent=String(Math.floor(tl/60)).padStart(2,'0')+':'+String(tl%60).padStart(2,'0');$('#tm').classList.toggle('run',tl>0)}
function timer(s){clearInterval(ti);tl=s;tick();if(!s)return;ti=setInterval(()=>{tl--;tick();if(tl<=0){clearInterval(ti);try{navigator.vibrate&&navigator.vibrate([300,150,300]);const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),500)}catch(e){}}},1000)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-v]');if(!t)return;if(t.dataset.v){S.v=t.dataset.v;sv();render();return}const a=t.dataset.a;
 if(a=='day'){S.d=t.dataset.k;sv();render()}else if(a=='lm')modal(t.dataset.d,+t.dataset.i);else if(a=='x')$('#mod').classList.remove('on');else if(a=='t')timer(+t.dataset.s);
 else if(a=='sp'){const l=lg(S.d);l.sup[t.dataset.k]=!l.sup[t.dataset.k];sv();t.classList.toggle('on')}
 else if(a=='all'){const d=dayOf(S.d),l=lg(S.d);d.ex.forEach((x,i)=>x.sets.forEach((s,j)=>l.c['e'+i+'s'+j]=true));sv();render()}
 else if(a=='clr'){delete S.logs[S.w+'|'+S.d];sv();render()}
 else if(a=='ex')$('#bk').value=JSON.stringify(S);else if(a=='im'){try{const o=JSON.parse($('#bk').value);if(!o.logs)throw 0;S=o;sv();render()}catch(x){$('#bk').value='No se pudo importar: pega una copia exportada completa.'}}
 else if(a=='rs'){if(t.dataset.q){S={w:1,v:'s',d:S.d,logs:{}};sv();$('#wk').value=1;render()}else{t.dataset.q=1;t.textContent='Pulsa otra vez para borrar';setTimeout(()=>{t.dataset.q='';t.textContent='Borrar todo'},3500)}}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(a=='ck'){const l=lg(S.d);l.c[t.dataset.k]=t.checked;sv();t.closest('.st').classList.toggle('d',t.checked);upd()}else if(a=='ck2'){lg('cc').c[t.dataset.k]=t.checked;sv()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const l=lg(S.d);if(f=='kg'||f=='rp')l[f][t.dataset.k]=t.value;else if(f=='rpe'){l.rpe=+t.value;$('#rv').textContent=t.value}else l.nt=t.value;sv()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#mod').classList.remove('on');if((e.key=='Enter'||e.key==' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
render();
</script></body></html>
